  rule_vl_pop_culture:0 "Lite: Pop Cultures"
  rule_vl_pop_culture_desc:0 "Changes every pop's culture when a new game starts, for far fewer pops and a much faster game. Anything other than Original changes nations, minorities, discrimination, cultural movements and nation forming, and culture-specific events stop firing. Merged cultures are built on one existing culture each, so that culture's content still works. Has no effect on saved games."
  setting_vl_one_culture:0 "One culture (fastest)"
  setting_vl_one_culture_desc:0 "Every pop and every country becomes Human. No cultural discrimination, movements or culture-based nation forming."
  setting_vl_culture_groups:0 "Heritage groups"
  setting_vl_culture_groups_desc:0 "Eleven cultures: European, East Asian, African and so on. Primary cultures and homelands merge too."
  setting_vl_culture_heritages:0 "Heritages"
  setting_vl_culture_heritages_desc:0 "About a hundred cultures: Germanic, Gallic, East Slavic and so on. Primary cultures and homelands merge too."
  setting_vl_original_cultures:0 "Original cultures"
  setting_vl_original_cultures_desc:0 "Historical cultures, as in vanilla. Slower."
  rule_vl_pop_religion:0 "Lite: Pop Religions"
  rule_vl_pop_religion_desc:0 "Changes every pop's religion when a new game starts, for fewer pops and a faster game. Anything other than Original changes religious discrimination and movements, and religion-specific events, journal entries and decisions stop firing. Merged religions are built on one existing religion each (Catholic, Sunni, Hindu, Confucian, Jewish, Animist, Atheist), so that religion's content still works. Has no effect on saved games."
  setting_vl_religion_one_faith:0 "One faith (fastest)"
  setting_vl_religion_one_faith_desc:0 "Every pop and every country follows the Faith. No religious discrimination or movements. Clergy work normally."
  setting_vl_religion_groups:0 "Heritage groups"
  setting_vl_religion_groups_desc:0 "Four religions: Abrahamic, Eastern, Naturalistic and Non-Spiritual."
  setting_vl_religion_heritages:0 "Heritages"
  setting_vl_religion_heritages_desc:0 "Seven religions: Christian, Islamic, Jewish, Dharmic, Taoic, Indigenous and Materialist."
  setting_vl_original_religions:0 "Original religions"
  setting_vl_original_religions_desc:0 "Historical religions, as in vanilla. Slower."
  rule_vl_pop_consolidation:0 "Lite: Pop Consolidation"
  rule_vl_pop_consolidation_desc:0 "When a new game starts, each state becomes entirely its largest culture and religion, after the Pop Cultures and Pop Religions rules. Minorities disappear within each state, and countries keep their primary cultures and state religions, so mixed empires can see more discrimination and unrest. On by default so you keep much of the speed-up if you set cultures or religions back to Original. Has no effect on saved games."
  setting_vl_consolidation_off:0 "Off"
  setting_vl_consolidation_off_desc:0 "States keep their mix of cultures and religions."
  setting_vl_consolidation_on:0 "On (faster)"
  setting_vl_consolidation_on_desc:0 "Each state becomes entirely its largest culture and religion."
  rule_vl_costly_alerts:0 "Lite: Costly Alerts"
  rule_vl_costly_alerts_desc:0 "Some alerts are expensive to check every tick. Turning them off makes late games faster."
  setting_vl_costly_alerts_off:0 "Off (faster)"
  setting_vl_costly_alerts_off_desc:0 "The 'low expected standard of living in a state' alert is not shown."
  setting_vl_costly_alerts_on:0 "On"
  setting_vl_costly_alerts_on_desc:0 "All alerts work as in vanilla."
