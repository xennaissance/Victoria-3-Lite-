  vl_heritage_group_human:0 "Human"
  vl_language_group_human:0 "Common"
  rule_vl_pop_culture:0 "Lite: Pop Cultures"
  rule_vl_pop_culture_desc:0 "Whether pops keep their historical cultures or all become one Human culture. One culture means far fewer pops, which makes the game run much faster. Culture-based mechanics (discrimination, cultural movements, national awakenings, culture-based country formation) mostly stop mattering."
  setting_vl_one_culture:0 "One culture (fastest)"
  setting_vl_one_culture_desc:0 "When the game starts, every pop becomes Human and every country's primary culture becomes Human."
  setting_vl_original_cultures:0 "Original cultures"
  setting_vl_original_cultures_desc:0 "Pops and countries keep their historical cultures, as in vanilla. More pops, so slower."
  rule_vl_pop_religion:0 "Lite: Pop Religions"
  rule_vl_pop_religion_desc:0 "Merging religions means fewer pops, which makes the game run faster. Merged religions take the name of their group or heritage."
  setting_vl_religion_one_faith:0 "One faith (fastest)"
  setting_vl_religion_one_faith_desc:0 "When the game starts, every pop and every country follows the One Faith. Religious discrimination and religion-specific content stop mattering. Clergy work normally."
  setting_vl_religion_groups:0 "Heritage groups"
  setting_vl_religion_groups_desc:0 "Four religions: Abrahamic, Eastern, Naturalistic and Non-Spiritual. Built on Catholic, Confucian, Animist and Atheist, so their events and journal entries still work."
  setting_vl_religion_heritages:0 "Heritages"
  setting_vl_religion_heritages_desc:0 "Seven religions: Christian, Islamic, Jewish, Dharmic, Taoic, Indigenous and Materialist. Built on Catholic, Sunni, Jewish, Hindu, Confucian, Animist and Atheist, so their events and journal entries still work."
  setting_vl_original_religions:0 "Original religions"
  setting_vl_original_religions_desc:0 "Pops and countries keep their historical religions, as in vanilla. More pops, so slower."
  rule_vl_pop_consolidation:0 "Lite: Pop Consolidation"
  rule_vl_pop_consolidation_desc:0 "Whether each state keeps its mix of cultures and religions, or becomes entirely its largest culture and religion. Works on top of the Pop Cultures and Pop Religions rules. Fewer mixes means fewer pops."
  setting_vl_consolidation_off:0 "Off"
  setting_vl_consolidation_off_desc:0 "States keep their mix of cultures and religions."
  setting_vl_consolidation_on:0 "On (faster)"
  setting_vl_consolidation_on_desc:0 "When the game starts, every pop in a state takes that state's largest culture and largest religion. Countries keep their primary cultures and state religions, so minorities in a state can become the majority's culture."
  rule_vl_costly_alerts:0 "Lite: Costly Alerts"
  rule_vl_costly_alerts_desc:0 "Some alerts are expensive to check every tick. Turning them off makes late games faster."
  setting_vl_costly_alerts_off:0 "Off (faster)"
  setting_vl_costly_alerts_off_desc:0 "The 'low expected standard of living in a state' alert is not shown. You can still see standard of living in the states panel."
  setting_vl_costly_alerts_on:0 "On"
  setting_vl_costly_alerts_on_desc:0 "All alerts work as in vanilla."
